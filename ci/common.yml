include:
  - /ci/whinlatter.yml
  - /ci/scarthgap.yml
  - /ci/kirkstone.yml

stages:
  - pre-flight-checks
  - build:whinlatter
  - build:scarthgap
  - build:kirkstone
  - test:whinlatter
  - test:scarthgap
  - test:kirkstone
  - yocto-check-layer
  - deploy
  - release

variables:
  BUILD_OUTPUT_DIR_TOP: build_output
  CI_MINIO_ALIAS: "spl2-build-artifacts-be"
  CI_MINIO_BROWSER: "http://10.226.35.98:9001/browser"
  CI_MINIO_BUCKET: "rz-community-bsp"
  CI_MINIO_SERVER: "http://10.226.35.98:9000"
  # CI_MINIO_USER and CI_MINIO_PASS need to be defined in GitLab CI

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG

.yocto-check-layer-base:
  stage: yocto-check-layer
  image: ghcr.io/siemens/kas/kas:4.8.2
  tags:
    - ree-du1sdd1
    - spl2
    - yocto
  needs: []
  script:
    - kas shell --update --force-checkout ${CI_KAS_CONFIG} -c \
      "yocto-check-layer-wrapper ${CI_PROJECT_DIR}/meta-rz-bsp --dependency ${CI_PROJECT_DIR}/meta-arm/meta-arm ${CI_PROJECT_DIR}/meta-arm/meta-arm-toolchain ${CI_PROJECT_DIR}/meta-openembedded/meta-oe ${CI_PROJECT_DIR}/poky/meta ${CI_PROJECT_DIR}/poky/meta-poky --no-auto-dependency --machines hihope-rzg2h hihope-rzg2m hihope-rzg2n ek874 smarc-rzg2l smarc-rzg2lc smarc-rzg2ul smarc-rzv2l"

pre-commit:
  stage: pre-flight-checks
  image: ubuntu:24.04
  before_script:
    - apt update && apt install -y git pipx
    - pipx install pre-commit
    - export PATH=~/.local/bin:$PATH
    - git config --global --add safe.directory ${CI_PROJECT_DIR}
  script:
    - pre-commit run -a

deploy-binaries:
  stage: deploy
  image: gitlab.global.renesas.com:5005/spl2/continuous-integration/dockerfiles:ubuntu-24.04-latest
  tags:
    - small
    - spl2
  dependencies: []
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  script:
    - mc alias set ${CI_MINIO_ALIAS} ${CI_MINIO_SERVER} ${CI_MINIO_USER} ${CI_MINIO_PASS}
    - echo "Copying test binaries to production directory on spl2-build-artifacts-be..."
    - mc mirror --retry --overwrite --remove ${CI_MINIO_ALIAS}/${CI_MINIO_BUCKET}/ci/${CI_PIPELINE_ID}/ ${CI_MINIO_ALIAS}/${CI_MINIO_BUCKET}/latest/
    - 'echo "Download URL: ${CI_MINIO_BROWSER}/${CI_MINIO_BUCKET}/latest/"'

push-to-github:
  stage: release
  image: ubuntu:24.04
  dependencies: []
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  before_script:
    - apt update && apt install -y git
    - git config --global --add safe.directory ${CI_PROJECT_DIR}
  script:
    - git remote remove github || true
    - git remote add github "https://GITHUB_DEPLOY_TOKEN:$GITHUB_DEPLOY_TOKEN@github.com/renesas-rz/rz-community-bsp.git"
    - git push -f github HEAD:whinlatter
    - git push -f github HEAD:scarthgap
    - git push -f github HEAD:kirkstone

### BUILDING ###
.build-base:
  image: ghcr.io/siemens/kas/kas:4.8.2
  tags:
    - spl2
    - yocto
  needs: []
  before_script:
    - find dependencies -name "*tar.gz" -exec tar xf '{}' \; || true
  after_script:
    - mkdir -p dependencies
    - |
      for repo in meta-arm meta-linux-mainline meta-openembedded meta-rz-panfrost poky; do
        if [ -d "${repo}" ]; then
          tar czf dependencies/"${repo}".tar.gz "${repo}"
        fi
      done
  cache:
    - key: "dependencies"
      paths:
        - dependencies

.copy-output: &copy-output
    - export BUILD_OUTPUT_DIR=${BUILD_OUTPUT_DIR_TOP}/${CI_BITBAKE_MACHINE}/${CI_BITBAKE_IMAGE}/${BUILD_NAME}
    - mkdir -p ${BUILD_OUTPUT_DIR}
    - cp -L scripts/lava-env/${CI_BITBAKE_MACHINE}.env ${BUILD_OUTPUT_DIR}
    - echo "ROOTFS=${CI_BITBAKE_IMAGE}-${CI_BITBAKE_MACHINE}.tar.gz" >> ${BUILD_OUTPUT_DIR}/${CI_BITBAKE_MACHINE}.env
    - source ${BUILD_OUTPUT_DIR}/${CI_BITBAKE_MACHINE}.env
    - cp -r build/conf ${BUILD_OUTPUT_DIR}
    - cp -L build/tmp/deploy/images/${CI_BITBAKE_MACHINE}/${KERNEL} ${BUILD_OUTPUT_DIR}
    - cp -L build/tmp/deploy/images/${CI_BITBAKE_MACHINE}/${ROOTFS} ${BUILD_OUTPUT_DIR}
    - cp -L build/tmp/deploy/images/${CI_BITBAKE_MACHINE}/${DTB} ${BUILD_OUTPUT_DIR}
    - cp -L build/tmp/deploy/images/${CI_BITBAKE_MACHINE}/${FW} ${BUILD_OUTPUT_DIR} || true
    - cp -L build/tmp/deploy/images/${CI_BITBAKE_MACHINE}/${BL2} ${BUILD_OUTPUT_DIR} || true
    - cp -L build/tmp/deploy/images/${CI_BITBAKE_MACHINE}/${FIP} ${BUILD_OUTPUT_DIR} || true
    - cp -L build/tmp/deploy/images/${CI_BITBAKE_MACHINE}/${SA0} ${BUILD_OUTPUT_DIR} || true
    - cp -L build/tmp/deploy/images/${CI_BITBAKE_MACHINE}/${SA6} ${BUILD_OUTPUT_DIR} || true
    - cp -L build/tmp/deploy/images/${CI_BITBAKE_MACHINE}/${BL31} ${BUILD_OUTPUT_DIR} || true
    - cp -L build/tmp/deploy/images/${CI_BITBAKE_MACHINE}/${UBOOT} ${BUILD_OUTPUT_DIR} || true
    - tar czf licenses.tar.gz build/tmp/deploy/licenses
    - cp licenses.tar.gz ${BUILD_OUTPUT_DIR}

.upload-artifacts: &upload-artifacts
    # Install Minio client
    - curl -Lso mc https://dl.min.io/client/mc/release/linux-amd64/mc
    - chmod +x mc
    - ./mc alias set ${CI_MINIO_ALIAS} ${CI_MINIO_SERVER} ${CI_MINIO_USER} ${CI_MINIO_PASS}
    # Upload test artifacts to fileserver
    - UPLOAD_PATH="ci/${CI_PIPELINE_ID}/${CI_YOCTO_VER}"
    - echo "Uploading test binaries to spl2-build-artifacts-be..."
    - ./mc cp -r --quiet ${BUILD_OUTPUT_DIR_TOP}/${CI_BITBAKE_MACHINE} ${CI_MINIO_ALIAS}/${CI_MINIO_BUCKET}/${UPLOAD_PATH}/
    - 'echo "Download URL: ${CI_MINIO_BROWSER}/${CI_MINIO_BUCKET}/${UPLOAD_PATH}/${CI_BITBAKE_MACHINE}/"'

