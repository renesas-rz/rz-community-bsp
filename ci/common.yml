### TESTING ###
.test-base:
  image: gitlab.global.renesas.com:5005/spl2/continuous-integration/dockerfiles:ubuntu-24.04-latest
  tags:
    - spl2
    - lava-job
  variables:
    MINIO_DL_URL: "${CI_MINIO_SERVER}/${CI_MINIO_BUCKET}/ci/${CI_PIPELINE_ID}/${CI_YOCTO_VER}/${CI_BITBAKE_MACHINE}/${CI_BITBAKE_IMAGE}/${BUILD_NAME}/"
  script:
    - mkdir -p results
    - echo "ROOTFS=${CI_BITBAKE_IMAGE}-${CI_BITBAKE_MACHINE}.tar.gz" >> scripts/lava-env/${CI_BITBAKE_MACHINE}.env
    - scripts/submit-lava-job.sh -i ${LAVACLI_IDENTITY} -d -u spl2-bot -e scripts/lava-env/${CI_BITBAKE_MACHINE}.env -j results -B ${MINIO_DL_URL} ${TEMPLATES} ${TESTS}
  artifacts:
    name: "${CI_JOB_NAME}"
    when: always
    expire_in: 1 year
    reports:
      junit: results/results*.xml
    paths:
      - results

.test-base-sdk:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  extends: [.test-base]

