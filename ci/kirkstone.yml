push-to-kirkstone:
  stage: deploy
  image: ubuntu:24.04
  tags:
    - small
    - spl2
  dependencies: []
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  before_script:
    - apt update && apt install -y git
    - git config --global --add safe.directory ${CI_PROJECT_DIR}
  script:
    - git remote remove ci || true
    - git remote add ci "https://CI_DEPLOY_TOKEN:$CI_DEPLOY_TOKEN@gitlab.global.renesas.com/spl2/civil-infrastructure-platform/rz-community-bsp.git"
    - git push -f ci HEAD:kirkstone


yocto-check-layer-kirkstone:
  extends: .yocto-check-layer-base
  variables:
    CI_KAS_CONFIG: kas/yocto/kirkstone.yml


